<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Kontakt | OPS Development</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/kontakt.css">
</head>
<body>
    <nav>
        <div class="wrap">
            <div class="brand"><span class="cursor"></span>OPS Development</div>
            <div class="nav-links">
                <a href="Home.html">Startseite</a>
                <a href="Leistung.html">Leistungen</a>
                <a href="Projekte.html">Projekte</a>
                <a href="Preise.html">Preise</a>
                <a href="Ueber-mich.html">Über mich</a>
                <a href="Kontakt.html">Kontakt</a>
            </div>
            <a href="kontakt.html" class="nav-cta">Projekt anfragen</a>
        </div>
    </nav>

    <section class="kontakt-hero">
        <div class="wrap">
            <div class="eyebrow">Kontakt</div>
            <h1>Lass uns dein Projekt besprechen.</h1>
            <p class="lead">Schreib mir kurz, worum es geht — ich melde mich zeitnah zurück.</p>
        </div>
    </section>

    <section class="kontakt-main">
        <div class="wrap kontakt-grid">
            <form class="kontakt-form" onsubmit="event.preventDefault(); alert('Formular ist noch ohne echten Versand.');">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input id="name" type="text" placeholder="Dein Name" required>
                    </div>

                    <div class="form-group">
                        <label for="firma">Firma</label>
                        <input id="firma" type="text" placeholder="Firmenname (optional)">
                    </div>
                </div>
                <label>Budget (optional)</label>

                <div class="budget-auswahl">
                    <button type="button" class="budget-btn" data-budget="150 - 500 €">150 - 500 €</button>
                    <button type="button" class="budget-btn" data-budget="500 - 1.000 €">500 - 1.000 €</button>
                    <button type="button" class="budget-btn" data-budget="1.000 - 2.500 €">1.000 - 2.500 €</button>
                    <button type="button" class="budget-btn" data-budget="2.500 €+">2.500 €+</button>
                    <button type="button" class="budget-btn" data-budget="Noch offen">Noch offen</button>
                </div>

                <input type="hidden" id="budget" name="budget">

                <label for="email">E-Mail</label>
                <input id="email" type="email" placeholder="deine@email.de" required>

                <label for="nachricht">Nachricht</label>
                <textarea id="nachricht" placeholder="Erzähle mir kurz von deinem Projekt ..." required></textarea>

                <button type="submit" class="btn btn-primary">Nachricht senden</button>
            </form>
        </div>
    </section>
    <section class="kontakt-info">
        <div class="wrap">
            <div class="badge-kontaktinfo">
                <div class="badge"><span class="info-icon"><svg class="icon icon-sm"><use href="svg/icons.svg#icon-mail"></use></svg></span>
                    E-Mail (bald)
                </div>
                <div class="badge"><span class="info-icon"><svg class="icon icon-sm"><use href="svg/icons.svg#icon-phone"></use></svg></span>
                    +49 151 56655516
                </div>
                <div class="badge"><span class="info-icon"><svg class="icon icon-sm"><use href="svg/icons.svg#icon-instagram"></use></svg></span>
                    Instagram (bald)
                </div>
                <div class="badge"><span class="info-icon"><svg class="icon icon-sm icon-filled"><use href="svg/icons.svg#icon-linkedin"></use></svg></span>
                    LinkedIn (bald)
                </div>
            </div>
        </div>
    </section>
    <script src="js/kontakt.js"></script>
</body>
</html>
